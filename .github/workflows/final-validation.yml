name: QA - cierre final desplegado

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_ai:
        description: Ejecutar bateria contra Groq real (requiere GROQ_API_KEY)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: final-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-evidence:
    name: Produccion - accesibilidad y carga 50 VUs / 5 min
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_EMAIL: final-qa@driveai.test
      SPRING_PROFILES_ACTIVE: prod
      GROQ_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.live_ai && secrets.GROQ_API_KEY || '' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar entorno efimero
        run: |
          mkdir -p work/lighthouse
          jwt_secret=$(openssl rand -base64 48)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          if [ "${{ inputs.live_ai }}" = "true" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Fausti debe configurar GROQ_API_KEY en los secrets del repositorio."
            exit 1
          fi

      - name: Desplegar imagenes reales
        id: deploy
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Verificar compra, State y mensajeria
        run: python3 ci/verify-partial2.py --frontend --messaging --report work/functional-smoke.json

      - name: Medir accesibilidad mobile y desktop
        id: lighthouse
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/lighthouse" --no-audit --no-fund lighthouse@12.8.2
          for device in mobile desktop; do
            for route in home catalog login; do
              url='http://localhost:5173/'
              if [ "$route" != home ]; then url="$url#/$route"; fi
              preset=()
              if [ "$device" = desktop ]; then preset=(--preset=desktop); fi
              "$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse" "$url" \
                --only-categories=accessibility "${preset[@]}" \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                --output=json --output-path="work/lighthouse/$route-$device.json" --quiet
            done
          done
          python3 ci/check-lighthouse.py work/lighthouse

      - name: Carga sobre frontend y API desplegados
        id: load
        continue-on-error: true
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src \
            -e BASE_URL=http://localhost:5173 -e SUMMARY_PATH=work/k6-summary.json \
            -e SOURCE_SHA="$SOURCE_SHA" \
            grafana/k6:1.0.0 run load-tests/k6.js

      - name: Bateria IA real solicitada por el responsable
        if: github.event_name == 'workflow_dispatch' && inputs.live_ai
        run: python3 ci/verify-live-ai.py --report work/live-ai.json

      - name: Registrar limites y resultados
        if: always()
        run: |
          echo '## Cierre de QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'La carga corresponde a un runner CI: no garantiza rendimiento de un hosting distinto.' >> "$GITHUB_STEP_SUMMARY"
          echo 'IA real solo se evalua si se solicita live_ai y existe la clave; sin ello queda pendiente.' >> "$GITHUB_STEP_SUMMARY"
          echo 'SonarCloud requiere configuracion del responsable en el workflow principal.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p work
          docker compose ps -a > work/compose-ps.txt
          docker compose logs --no-color backend frontend rabbitmq > work/compose.log

      - name: Conservar evidencia de esta version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-qa-evidence
          path: work/
          retention-days: 14

      - name: Exigir umbrales sin ocultar fallos
        if: always() && steps.deploy.outcome == 'success'
        run: |
          test "${{ steps.lighthouse.outcome }}" = success
          test "${{ steps.load.outcome }}" = success

      - name: Detener entorno
        if: always()
        run: docker compose down
