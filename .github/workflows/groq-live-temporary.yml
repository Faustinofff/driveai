name: Groq real - verificacion temporal PR 5

on:
  push:
    branches: [qa/groq-real-20261115]

permissions:
  contents: read

concurrency:
  group: groq-real-verificacion-pr5
  cancel-in-progress: true

jobs:
  live-groq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_EMAIL: groq-live@driveai.test
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno temporal
        run: |
          mkdir -p work
          jwt_secret=$(openssl rand -base64 48)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - name: Probar diagnosticos
        run: python3 -m unittest discover -s ci -p 'test_groq_diagnostics.py'
      - name: Verificar clave y modelo en Groq
        continue-on-error: true
        run: python3 ci/verify-live-ai.py --check-provider --report work/groq-provider.json
      - name: Contrastar cliente HTTP sin exponer respuesta
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          request = urllib.request.Request("https://api.groq.com/openai/v1/models",
              headers={"Authorization": "Bearer " + os.environ["GROQ_API_KEY"],
                       "User-Agent": "DriveAI-Groq/1.0"})
          result = {"client": "DriveAI-Groq/1.0"}
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result["httpStatus"] = response.status
                  data = json.load(response)
                  result["selectedModelAvailable"] = any(
                      x.get("id") == os.environ["GROQ_MODEL"] for x in data.get("data", []))
          except urllib.error.HTTPError as error:
              result["httpStatus"] = error.code
              body = error.read(16384).decode("utf-8", "replace")
              result["edgeClientPolicy"] = "1010" in body and "error" in body.lower()
              try:
                  code = json.loads(body).get("error", {}).get("code")
                  safe = {"invalid_api_key", "model_decommissioned", "model_not_found",
                          "insufficient_permissions", "permission_denied", "access_denied",
                          "rate_limit_exceeded", "insufficient_quota", "unsupported_country"}
                  result["providerCode"] = code if isinstance(code, str) and code in safe else "unclassified"
              except (ValueError, AttributeError):
                  result["providerCode"] = "non-json-response"
          except (urllib.error.URLError, TimeoutError):
              result["connection"] = "failed"
          with open("work/groq-client-probe.json", "w") as output:
              json.dump(result, output, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - name: Desplegar la aplicacion del PR 5
        id: deploy
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Probar compra, State y mensajeria
        run: python3 ci/verify-partial2.py --frontend --messaging --report work/functional-smoke.json
      - name: Ejecutar los seis casos contra Groq real
        run: python3 ci/verify-live-ai.py --report work/live-ai.json
      - name: Registrar evidencia sin respuestas privadas
        if: always()
        run: |
          mkdir -p work
          docker compose ps -a > work/compose-ps.txt
          docker compose logs --no-color backend frontend > work/compose.log
          echo 'Base de aplicacion: f31909b9154850082b30c05daf4ac260695d51f4 (PR 5).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Esta rama solo agrega el disparador temporal; no modifica main ni los secretos.' >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-live-pr5-evidence
          path: work/
          retention-days: 14
      - name: Detener entorno
        if: always()
        run: docker compose down
