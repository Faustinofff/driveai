name: Entrega 2 - flujo desplegado

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-flow:
    name: Compose - Nginx, checkout y consumo RabbitMQ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_EMAIL: partial2-admin@driveai.test
      SPRING_PROFILES_ACTIVE: prod
    steps:
      - uses: actions/checkout@v4

      - name: Generar credenciales efimeras
        shell: bash
        run: |
          jwt_secret=$(openssl rand -base64 48)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          db_password=$(openssl rand -hex 24)
          mq_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$mq_password"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "RABBITMQ_USER=driveai" >> "$GITHUB_ENV"
          echo "RABBITMQ_PASSWORD=$mq_password" >> "$GITHUB_ENV"

      - name: Construir y desplegar las capas
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Probar frontend, JWT, roles, checkout, State y mensajeria
        run: python3 ci/verify-partial2.py --frontend --messaging --report work/partial2-smoke.json

      - name: Verificar HTTPS en nginx (DEF-19)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          base=https://localhost:5443
          # Se valida contra el certificado autofirmado del propio contenedor (sin -k):
          # falla si el certificado no corresponde a localhost.
          docker compose cp frontend:/etc/nginx/certs/tls.crt work/tls-ca.crt
          # Handshake TLS 1.2+ y cabeceras de seguridad servidas por HTTPS.
          curl -sS --cacert work/tls-ca.crt --tlsv1.2 -o /dev/null -D work/https-headers.txt "$base/"
          grep -qiE '^HTTP/[0-9.]+ 200' work/https-headers.txt
          grep -qi '^strict-transport-security:' work/https-headers.txt
          grep -qi '^content-security-policy:' work/https-headers.txt
          # La API responde por HTTPS a traves del proxy, con el origen HTTPS permitido en CORS.
          code=$(curl -sS --cacert work/tls-ca.crt -o /dev/null -w '%{http_code}' -H "Origin: $base" "$base/api/cars")
          test "$code" = 200
          body=$(python3 -c 'import json,os; print(json.dumps({"email": os.environ["ADMIN_EMAIL"], "password": os.environ["ADMIN_PASSWORD"]}))')
          code=$(curl -sS --cacert work/tls-ca.crt -o /dev/null -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/json' --data "$body" "$base/api/auth/login")
          test "$code" = 200
          # Evidencia del certificado (solo sujeto y vencimiento; nunca la clave).
          echo | openssl s_client -connect localhost:5443 -servername localhost -CAfile work/tls-ca.crt -verify_return_error 2>/dev/null \
            | openssl x509 -noout -subject -enddate | tee work/https-cert.txt
          echo "HTTPS OK: TLS, cabeceras, API y login por https://localhost:5443"

      - name: Registrar estado y logs del despliegue
        if: always()
        run: |
          mkdir -p work
          docker compose ps -a > work/compose-ps.txt
          docker compose logs --no-color backend rabbitmq frontend > work/compose.log

      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial2-deployed-flow
          path: work/
          retention-days: 7

      - name: Detener servicios
        if: always()
        run: docker compose down
