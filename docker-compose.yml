# ============================================================================
# DriveAI — Orquestación de servicios con Docker Compose
# Uso:       docker compose up -d --build
# Detener:   docker compose down
# Reset DB:  docker compose down -v
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — base de datos principal
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: driveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardb}
      POSTGRES_USER: ${POSTGRES_USER:-cardb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardb_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardb_user} -d ${POSTGRES_DB:-cardb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --------------------------------------------------------------------------
  # Backend — Spring Boot 3 (Java 17)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driveai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cardb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cardb_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cardb_pass}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound-mini}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Frontend — React + Vite (empaquetado y servido por Nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driveai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres-data:
    driver: local