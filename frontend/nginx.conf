# DEF-19: el frontend se sirve por HTTPS (443, publicado en FRONTEND_HTTPS_PORT).
# El certificado lo genera docker-entrypoint.d/10-driveai-tls.sh al crear el
# contenedor: no hay certificados ni claves en el repositorio (G6).
# El HTTP (80) se mantiene para la suite automatizada (E2E, ZAP, k6) que corre
# contra http://localhost:5173 dentro de la misma máquina.

gzip on;
gzip_comp_level 6;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/driveai-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/driveai-locations.conf;
}
