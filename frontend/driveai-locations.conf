# Rutas compartidas por el server HTTP (8080) y el HTTPS (8443). Ver nginx.conf.

# API del backend (Java). El base "/api/" mapea a "/api/" en backend.
location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # DEF-07: se sobrescribe (no se anexa) para que el cliente no inyecte IPs falsas.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Healthcheck del backend
location /actuator/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # DEF-07: se sobrescribe (no se anexa) para que el cliente no inyecte IPs falsas.
    proxy_set_header X-Forwarded-For $remote_addr;
}

# SPA
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
